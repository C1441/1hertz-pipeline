name: Papan Ide mingguan (tim kreatif)

on:
  schedule:
    # Senin 06:07 WIB (Minggu 23:07 UTC)
    - cron: '7 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  papan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Susun Papan Ide (sinyal forum/GitHub/Reddit → Gemini → Google Docs di 1Hertz/ide)
        run: node pipeline/papan-ide.js buat
